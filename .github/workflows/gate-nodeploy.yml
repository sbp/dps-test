name: gate-nodeploy
on: workflow_dispatch
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      deployment: false
    permissions:
      id-token: write
    steps:
      - run: |
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dps-test" \
            | python3 -c 'import base64, json, sys; p = json.load(sys.stdin)["value"].split(".")[1]; c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4))); print({k: c.get(k) for k in ("environment", "environment_node_id", "sub", "job_workflow_ref", "run_id", "run_attempt")})'
